<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Augurio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="center-screen">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 520px; width: 100%;">
      <div class="muted" style="font-size: 13px; letter-spacing: 4px; text-transform: uppercase;">El Ciclo · Cruza el Umbral</div>

      <div id="quiz" class="card" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center;">
        <h1 style="font-size: 22px;">El Augurio te observa</h1>
        <p class="muted" style="margin: 0;">¿Negocias con el enemigo o atacas primero? Tu elección es solo el comienzo: el Augurio decide de verdad.</p>
        <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
          <button class="btn secondary" data-choice="negociar">Negociar</button>
          <button class="btn secondary" data-choice="atacar">Atacar</button>
        </div>
        <div id="error" class="error" style="display: none;"></div>
      </div>

      <div id="result" class="card" style="width: 100%; display: none; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
        <div id="result-pill" class="pill" style="border: 1px solid var(--accent); color: var(--accent);"></div>
        <h1 id="result-name" style="font-size: 24px;"></h1>
        <p class="muted" style="margin: 0;">Tu facción queda fijada para toda la temporada. +10 Chispas de bienvenida.</p>
        <a class="btn" href="/poblado.html" style="text-decoration: none;">Entrar al poblado →</a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/augurio.js"></script>
</body>
</html>
