# Producción: VPS + Docker Compose + Caddy (TLS automático). Ver docs/DEPLOY.md.
# Uso (en el servidor, con .env relleno junto a este fichero):
#   docker compose -f docker-compose.prod.yml up -d --build
# Fichero autónomo (no se combina con docker-compose.yml): la BD no publica puertos
# y solo Caddy expone 80/443 al exterior.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Solo Caddy habla con el backend (red interna): se confía en su X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # Mismo dominio: Caddy enruta /api/* al backend.
        VITE_API_BASE: https://${DOMAIN:?Define DOMAIN en .env}
    restart: always
    depends_on:
      - backend
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - backend
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
